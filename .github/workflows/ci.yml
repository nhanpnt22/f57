name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

  rust-tests:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked --all-targets

  python-tests:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest -q

  dart-tests:
    name: Dart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/dart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test -r compact

  javascript-tests:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/javascript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: implementations/javascript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --silent

  typescript-tests:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: implementations/ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --silent
