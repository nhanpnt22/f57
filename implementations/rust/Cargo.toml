[package]
name = "f57"
version = "0.3.0"
edition = "2021"
description = "F57 binary-to-text encoding with H57, ID57 (bit-length and fixed-width), I57, and R57 profiles"
repository = "https://github.com/aco/f57"
homepage = "https://github.com/aco/f57"
documentation = "https://github.com/aco/f57/tree/main/implementations/rust"
readme = "README.md"
license-file = "../../LICENSE"
keywords = ["f57", "encoding", "identifier", "crypto"]
categories = ["encoding", "cryptography", "algorithms"]

[dependencies]
aes-gcm = "0.10"
blake3 = "1.5"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
once_cell = "1.19"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
